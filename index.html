<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="매주 말씀을 읊조리며 횟수를 세는 하가다 페이지" />
  <title>새가나안교회 하가다</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- 날짜 + 칭호 + 글자 크기 조절 -->
  <div id="date-container">
    <div class="date-center">
      <h2 id="date"></h2>
      <span id="title-badge"></span>
    </div>
    <div class="font-controls">
      <button id="font-decrease" class="font-size-btn" type="button">-</button>
      <button id="font-increase" class="font-size-btn" type="button">+</button>
    </div>
  </div>

  <!-- 말씀 영역 -->
  <div id="verse-container">
    <div id="verse">
      <strong id="verse-ref" class="verse-title"></strong>
      <div id="verse-body"></div>
    </div>
  </div>

  <!-- 버튼 및 카운터 영역 -->
  <div class="button-container">
    <div id="counter">0</div>
    <div class="button-row">
      <button id="btn-reset" class="reset" type="button">리셋</button>
      <button id="btn-lang" class="toggle-lang" type="button">영문</button>
    </div>
    <div class="button-row">
      <button id="btn-increase" class="increase" type="button">+1</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
