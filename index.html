<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="description" content="매주 말씀을 읊조리며 횟수를 세는 하가다 페이지" />
  <title>새가나안교회 하가다</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- 날짜 + 칭호 + 글자 크기 조절 -->
  <header class="top">
    <div class="sync-controls">
      <button id="btn-stats" class="sync-btn" type="button" aria-label="나의 말씀 여정 보기">📊</button>
    </div>
    <div class="date-wrap">
      <h1 id="date"></h1>
      <button id="title-badge" type="button" aria-label="나의 말씀 여정 보기"></button>
    </div>
    <div class="font-controls">
      <button id="font-decrease" class="font-size-btn" type="button" aria-label="글자 작게">-</button>
      <button id="font-increase" class="font-size-btn" type="button" aria-label="글자 크게">+</button>
    </div>
  </header>

  <!-- 말씀 카드: 별도 프레임/내부 스크롤 없이 문서 흐름을 따라 표시 -->
  <main class="verse-main">
    <article class="verse-card">
      <div class="verse-heading">
        <span id="verse-ref" class="verse-ref"></span>
        <button id="btn-refresh-verse" class="verse-refresh" type="button"
                aria-label="말씀 새로고침" title="말씀 새로고침"></button>
      </div>
      <p id="verse-body" class="verse-body"></p>
    </article>
  </main>

  <!-- 카운터 + 버튼: 화면 하단 고정 독 -->
  <footer class="dock">
    <div id="counter" class="counter">0</div>
    <div id="goal-progress" class="goal-progress">
      <div class="goal-bar"><div id="goal-fill" class="goal-fill"></div></div>
      <span id="goal-text" class="goal-text">0 / 100</span>
    </div>
    <div class="button-row">
      <button id="btn-reset" class="btn btn-reset" type="button">리셋</button>
      <button id="btn-lang" class="btn btn-lang" type="button">영문</button>
    </div>
    <div class="button-row">
      <button id="btn-increase" class="btn btn-increase" type="button">+1</button>
    </div>
  </footer>

  <!-- 20/40/60/80회 짧은 피드백 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 100회 달성 완료 카드 -->
  <div id="done-overlay" class="done-overlay" hidden>
    <div class="done-card">
      <div class="done-emoji">🏆</div>
      <h2>오늘의 하가다 완료</h2>
      <p id="done-streak" class="done-line done-strong"></p>
      <p id="done-tree" class="done-line"></p>
      <p id="done-total" class="done-line"></p>
      <p id="done-month" class="done-line done-soft"></p>
      <p id="done-tomorrow" class="done-line done-hook"></p>
      <button id="btn-done-sync" class="btn done-sync-btn" type="button" hidden>💬 카카오로 기록 지키기</button>
      <button id="btn-done-close" class="btn done-btn" type="button">계속 읊조리기</button>
    </div>
  </div>

  <!-- 상황판: 나의 말씀 여정 -->
  <div id="stats-overlay" class="done-overlay" hidden>
    <div class="done-card stats-card">
      <h2>나의 말씀 여정</h2>

      <div class="stats-tree">
        <span id="st-tree-emoji" class="stats-tree-emoji"></span>
        <span id="st-tree-label" class="stats-tree-label"></span>
      </div>

      <p id="st-title" class="stats-title-line"></p>

      <div class="stats-grid">
        <div><b id="st-streak"></b><span>현재 연속</span></div>
        <div><b id="st-best"></b><span>최고 연속</span></div>
        <div><b id="st-month"></b><span>이번 달 달성</span></div>
        <div><b id="st-total"></b><span>누적 읊조림</span></div>
      </div>

      <div class="stats-level">
        <div class="stats-level-head">
          <span id="st-level"></span>
          <span id="st-level-remain"></span>
        </div>
        <div class="goal-bar"><div id="st-level-fill" class="goal-fill"></div></div>
      </div>

      <p class="stats-today">오늘 <b id="st-today"></b></p>

      <div id="st-sync-section" hidden>
        <p id="st-sync-msg" class="stats-sync-msg"></p>
        <button id="btn-stats-kakao" class="btn done-sync-btn stats-kakao" type="button" hidden>💬 카카오로 기록 지키기</button>
        <div class="stats-account-actions">
          <button id="btn-stats-nickname" class="stats-logout" type="button" hidden>✏️ 닉네임 변경</button>
          <button id="btn-stats-logout" class="stats-logout" type="button" hidden>카카오 연결 해제</button>
        </div>
      </div>

      <a class="stats-crosslink" href="https://haruping.godagent.net" target="_blank" rel="noopener">
        <span class="crosslink-emoji">⌨️</span>
        <span class="crosslink-text"><b>하루핑</b><small>말씀을 한 글자씩 필사하며 묵상해요</small></span>
        <span class="crosslink-arrow">›</span>
      </a>
      <a class="stats-crosslink" href="https://manna.godagent.net" target="_blank" rel="noopener">
        <span class="crosslink-emoji">🍞</span>
        <span class="crosslink-text"><b>만나</b><small>매일 큐티 말씀으로 배우는 영어</small></span>
        <span class="crosslink-arrow">›</span>
      </a>

      <button id="btn-stats-close" class="btn done-btn" type="button">닫기</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
