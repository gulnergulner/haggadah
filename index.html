<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="description" content="매주 말씀을 읊조리며 횟수를 세는 하가다 페이지" />
  <title>새가나안교회 하가다</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- 날짜 + 칭호 + 글자 크기 조절 -->
  <header class="top">
    <div class="sync-controls">
      <button id="btn-sync" class="sync-btn" type="button" hidden aria-label="카카오 계정으로 기록 동기화">☁️</button>
    </div>
    <div class="date-wrap">
      <h1 id="date"></h1>
      <span id="title-badge"></span>
    </div>
    <div class="font-controls">
      <button id="font-decrease" class="font-size-btn" type="button" aria-label="글자 작게">-</button>
      <button id="font-increase" class="font-size-btn" type="button" aria-label="글자 크게">+</button>
    </div>
  </header>

  <!-- 말씀 카드: 별도 프레임/내부 스크롤 없이 문서 흐름을 따라 표시 -->
  <main class="verse-main">
    <article class="verse-card">
      <span id="verse-ref" class="verse-ref"></span>
      <p id="verse-body" class="verse-body"></p>
    </article>
  </main>

  <!-- 카운터 + 버튼: 화면 하단 고정 독 -->
  <footer class="dock">
    <div id="counter" class="counter">0</div>
    <div id="goal-progress" class="goal-progress">
      <div class="goal-bar"><div id="goal-fill" class="goal-fill"></div></div>
      <span id="goal-text" class="goal-text">0 / 100</span>
    </div>
    <div class="button-row">
      <button id="btn-reset" class="btn btn-reset" type="button">리셋</button>
      <button id="btn-lang" class="btn btn-lang" type="button">영문</button>
    </div>
    <div class="button-row">
      <button id="btn-increase" class="btn btn-increase" type="button">+1</button>
    </div>
  </footer>

  <!-- 20/40/60/80회 짧은 피드백 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 100회 달성 완료 카드 -->
  <div id="done-overlay" class="done-overlay" hidden>
    <div class="done-card">
      <div class="done-emoji">🏆</div>
      <h2>오늘의 하가다 완료</h2>
      <p id="done-streak" class="done-line done-strong"></p>
      <p id="done-tree" class="done-line"></p>
      <p id="done-total" class="done-line"></p>
      <p id="done-month" class="done-line done-soft"></p>
      <p id="done-tomorrow" class="done-line done-hook"></p>
      <button id="btn-done-sync" class="btn done-sync-btn" type="button" hidden>💬 카카오로 기록 지키기</button>
      <button id="btn-done-close" class="btn done-btn" type="button">계속 읊조리기</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
