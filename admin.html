<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>하가다 관리자</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="admin-app" class="admin">
    <header class="admin-header">
      <h1>하가다 관리자</h1>
      <div>
        <a class="admin-back" href="/">성도 화면</a>
        <button id="btn-logout" type="button" hidden>로그아웃</button>
      </div>
    </header>

    <p id="config-warning" class="notice notice-warn" hidden>
      Supabase 설정이 아직 없습니다. <code>src/supabase.js</code>에
      프로젝트 URL과 anon 키를 넣어주세요.
    </p>

    <section id="login-view" hidden>
      <form id="login-form" class="card">
        <h2>로그인</h2>
        <label>이메일
          <input id="login-email" type="email" autocomplete="username" required />
        </label>
        <label>비밀번호
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="notice notice-error" hidden></p>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
    </section>

    <section id="editor-view" hidden>
      <form id="verse-form" class="card">
        <h2>이번 주 말씀 게시</h2>
        <label>게시일 (주일)
          <input id="f-date" type="date" required />
        </label>
        <label>출처 (한글, 예: 시편 1:1-3)
          <input id="f-reference" type="text" required />
        </label>
        <label>본문 (한글)
          <textarea id="f-body-ko" rows="8" required></textarea>
        </label>
        <label>출처 (영문, 예: Psalm 1:1-3)
          <input id="f-reference-en" type="text" required />
        </label>
        <label>본문 (영문)
          <textarea id="f-body-en" rows="8" required></textarea>
        </label>
        <div class="form-actions">
          <button id="btn-preview" type="button">미리보기</button>
          <button type="submit" class="btn-primary">게시하기</button>
        </div>
        <p id="save-status" class="notice" hidden></p>
      </form>

      <section id="preview" class="card preview" hidden>
        <h2>미리보기</h2>
        <div class="preview-tabs">
          <button id="pv-ko" type="button" class="active">한글</button>
          <button id="pv-en" type="button">English</button>
        </div>
        <p id="pv-reference" class="pv-reference"></p>
        <p id="pv-body" class="pv-body"></p>
      </section>

      <section class="card">
        <h2>이전 말씀</h2>
        <ul id="verse-list" class="verse-list"></ul>
      </section>
    </section>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
